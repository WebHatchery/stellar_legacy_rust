[package]
name = "stellar_legacy"
version = "0.2.1"
edition = "2021"

[features]
default = []
demo = []
# Owner analysis harnesses: the autoplay soak and the release-balance matrix.
# Never part of a shipped build; CI runs them through --all-features.
analysis = []

[dependencies]
macroquad = { version = "=0.4.16", features = ["audio"] }
macroquad-toolkit = { path = "../macroquad-toolkit" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
winres = "0.1"
